# Checks that need no raw data: every script compiles, the paper's numbers, tables and figures match results/, and
# the quadrotor and Crazyflie scripts run end to end on synthetic data.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy, SciPy and Matplotlib at the versions in requirements.txt
        run: pip install $(grep -E '^(numpy|scipy|matplotlib)==' requirements.txt)
      - name: Compile every script
        run: python -m compileall -q code paper tests
      - name: Paper numbers (Tables 1-4, 8, 9, Fig. 2 and the text)
        run: python paper/ras/check_numbers.py
      - name: Tables 5-7 and the pooled files
        run: python paper/ras/check_tables.py
      - name: Figures 2 and 3, byte for byte
        run: python paper/check_figs.py

  smoke:
    # the experiment scripts run end to end, made small (tests/smoke_*.py): quadrotor and Crazyflie on synthetic
    # data, the MuJoCo car with fewer logs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [drone, crazyflie, mujoco]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install CPU PyTorch and the packages the scripts import, at the versions in requirements.txt
        run: |
          pip install $(grep -E '^torch==' requirements.txt) --index-url https://download.pytorch.org/whl/cpu
          pip install $(grep -E '^(numpy|scipy|scikit-learn|mujoco)==' requirements.txt)
      - name: MuSHR car model (prl-mushr/mushr_mujoco_ros, BSD-3), as the README describes
        if: matrix.platform == 'mujoco'
        run: |
          git clone -q https://github.com/prl-mushr/mushr_mujoco_ros "$RUNNER_TEMP/mushr"
          git -C "$RUNNER_TEMP/mushr" checkout -q c86eef33dadb0e98fe916a55ac6aa1fc03af027e
          echo "MUSHR_CARS=$RUNNER_TEMP/mushr/models/cars" >> "$GITHUB_ENV"
      - name: Run the ${{ matrix.platform }} scripts
        run: python tests/smoke_${{ matrix.platform }}.py
