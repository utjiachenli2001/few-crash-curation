# Checks that need no raw data and take under a minute: every script compiles, and the paper's numbers, tables and
# figures match results/. On every push and pull request.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy, SciPy and Matplotlib at the versions in requirements.txt
        run: pip install $(grep -E '^(numpy|scipy|matplotlib)==' requirements.txt)
      - name: Compile every script
        run: python -m compileall -q code paper tests
      - name: No undefined names or other Pyflakes errors (unused imports are allowed)
        run: |
          pip install ruff==0.17.3
          ruff check --no-cache --select F --ignore F401,F541 code paper tests
      - name: Paper numbers (Tables 1-4, 8, 9, Fig. 2 and the text)
        run: python paper/ras/check_numbers.py
      - name: Tables 5-7 and the pooled files
        run: python paper/ras/check_tables.py
      - name: Figures 2 and 3, byte for byte
        run: python paper/check_figs.py
