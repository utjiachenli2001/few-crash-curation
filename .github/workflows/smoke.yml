# The experiment scripts run end to end, made small (tests/smoke_*.py): the quadrotor (the README's table, in two
# parts) and the Crazyflie on synthetic flights, the MuJoCo car with fewer logs. A few minutes per platform, about 12
# for drone_more, so only when the code, the tests or the pinned versions change, or by hand.
name: smoke

on:
  push:
    paths: ["code/**", "tests/**", "requirements.txt", ".github/workflows/smoke.yml"]
  pull_request:
    paths: ["code/**", "tests/**", "requirements.txt", ".github/workflows/smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [drone, drone_more, crazyflie, mujoco]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install CPU PyTorch and the packages the scripts import, at the versions in requirements.txt
        run: |
          pip install $(grep -E '^torch==' requirements.txt) --index-url https://download.pytorch.org/whl/cpu
          pip install $(grep -E '^(numpy|scipy|scikit-learn|pandas|mujoco)==' requirements.txt)
      - name: MuSHR car model (prl-mushr/mushr_mujoco_ros, BSD-3), as the README describes
        if: matrix.platform == 'mujoco'
        run: |
          git clone -q https://github.com/prl-mushr/mushr_mujoco_ros "$RUNNER_TEMP/mushr"
          git -C "$RUNNER_TEMP/mushr" checkout -q c86eef33dadb0e98fe916a55ac6aa1fc03af027e
          echo "MUSHR_CARS=$RUNNER_TEMP/mushr/models/cars" >> "$GITHUB_ENV"
      - name: Run the ${{ matrix.platform }} scripts
        run: python tests/smoke_${{ matrix.platform }}.py
